# Gradle's own JVM. 8 GB + 4 GB metaspace was too much on a typical dev PC:
# the Kotlin compiler daemon (see below) used to inherit these same settings and
# start as a SECOND huge JVM, which is what failed with "Failed connecting to
# the daemon in 4 retries".
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Compile Kotlin inside the Gradle process instead of a separate Kotlin daemon.
# This removes the daemon connection step entirely (no second JVM, no
# localhost/firewall/antivirus dependency). Slightly slower first build only.
kotlin.compiler.execution.strategy=in-process

# Only used if the strategy above is ever switched back to "daemon": keeps the
# Kotlin daemon small instead of inheriting Gradle's settings.
kotlin.daemon.jvmargs=-Xmx2G

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin (AGP 9+). Requires Flutter 3.47+; plugins such as
# firebase_core only skip applying their own KGP when this is true.
android.builtInKotlin=true
