name: ayre_scanner
description: "Investee: market research and signals."
publish_to: 'none'

version: 2.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  # Push notifications (FCM). See lib/services/push_service.dart.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.4.3
  # Account sign-in (email + password). Only lib/services/auth_service.dart
  # talks to this package.
  firebase_auth: ^6.1.0
  # Opens the required attribution link for the free "Ticker Logos by
  # AllInvestView" service the bundled assets/logos/ images were sourced
  # from (see lib/screens/settings_screen.dart).
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # The authoritative brand mark, used as-is rather than recreated.
    - assets/brand/ayre_logo.png
    - assets/brand/ayre_logo_light.png
    - assets/brand/investee_mark_on_dark.png
    - assets/brand/investee_mark_on_light.png
    # Bundled company logos for AyreInstrumentTile (see
    # lib/services/stock_logo_service.dart), one PNG per NSE trading symbol
    # covering Nifty 500 + Sensex 30 + Bank Nifty. Declaring the directory
    # (trailing slash) bundles every file inside it.
    - assets/logos/

  # Manrope (SIL OFL 1.1, see assets/fonts/OFL.txt): static instances cut from
  # the official variable font so all four weights render offline, including
  # the rupee sign and the true minus.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
