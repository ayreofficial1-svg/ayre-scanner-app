name: ayre_scanner
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  # Push notifications (FCM). See lib/services/push_service.dart.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.4.3
  # Opens the required attribution link for the free "Ticker Logos by
  # AllInvestView" service the bundled assets/logos/ images were sourced
  # from (see lib/screens/settings_screen.dart).
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # The authoritative brand mark, used as-is rather than recreated.
    - assets/brand/ayre_logo.png
    # Bundled company logos for AyreInstrumentTile (see
    # lib/services/stock_logo_service.dart), one PNG per NSE trading symbol
    # covering Nifty 500 + Sensex 30 + Bank Nifty. Declaring the directory
    # (trailing slash) bundles every file inside it.
    - assets/logos/
